# Gazebo -> ROS 2 topics for Phase 3 (ros_gz_bridge parameter_bridge).
# Images keep Gazebo's header stamps (simulation time) and frame id
# (rgbd_optical_frame, set by <gz_frame_id> in sim/models/x500_mapper).
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /camera/color/image_raw
  gz_topic_name: /x500_mapper/rgbd/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/depth/image_raw
  gz_topic_name: /x500_mapper/rgbd/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/color/camera_info
  gz_topic_name: /x500_mapper/rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
